<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="hero-top">
        <div class="brand">
          <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="6" y="6" width="8" height="28" rx="2" fill="#F2A93B"/>
            <rect x="16" y="9" width="8" height="25" rx="2" fill="#8FA2F5"/>
            <rect x="26" y="6" width="8" height="28" rx="2" fill="#fff" transform="rotate(8 30 20)"/>
          </svg>
          <div>
            <h1>Library Management System</h1>
            <p>Browse, issue and track every book in one place.</p>
          </div>
        </div>
        <div class="hero-actions">
          <button type="button" class="btn ghost-light" id="open-member">Add member</button>
          <button type="button" class="btn gold" id="open-book">Add book</button>
        </div>
      </div>

      <dl class="stats" aria-live="polite">
        <div class="stat"><dt>Total books</dt><dd id="stat-total">0</dd></div>
        <div class="stat"><dt>Available</dt><dd id="stat-available">0</dd></div>
        <div class="stat"><dt>Issued</dt><dd id="stat-issued">0</dd></div>
        <div class="stat"><dt>Members</dt><dd id="stat-members">0</dd></div>
      </dl>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="visually-hidden">Search books</span>
        <input type="search" id="search" placeholder="Search by title, author or ISBN" autocomplete="off">
      </label>
      <div class="filters" role="group" aria-label="Filter by availability">
        <button type="button" class="chip is-on" data-status="">All</button>
        <button type="button" class="chip" data-status="available">Available</button>
        <button type="button" class="chip" data-status="issued">Issued</button>
      </div>
    </div>

    <p class="result-line" id="result-line" aria-live="polite"></p>
    <section class="grid" id="book-grid" aria-label="Book catalog"></section>
    <div class="empty" id="empty" hidden>
      <p id="empty-text"></p>
      <button type="button" class="btn primary" id="empty-add">Add a book</button>
    </div>
  </main>

  <dialog id="book-dialog">
    <form id="book-form" novalidate>
      <h2>Add a book</h2>
      <label>Title <input name="title" required autofocus></label>
      <label>Author <input name="author" required></label>
      <div class="row">
        <label>ISBN <input name="isbn" inputmode="numeric" placeholder="10 or 13 digits" required></label>
        <label>Category <input name="category" placeholder="General" list="categories"></label>
      </div>
      <datalist id="categories">
        <option>Computer Science</option><option>Electronics</option><option>Mathematics</option>
        <option>Fiction</option><option>Biography</option><option>Science</option>
      </datalist>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Add book</button>
      </div>
    </form>
  </dialog>

  <dialog id="member-dialog">
    <form id="member-form" novalidate>
      <h2>Add a member</h2>
      <label>Name <input name="name" required autofocus></label>
      <label>Email <input name="email" type="email" required></label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Add member</button>
      </div>
    </form>
  </dialog>

  <dialog id="issue-dialog">
    <form id="issue-form">
      <h2>Issue book</h2>
      <p id="issue-title" class="dialog-book"></p>
      <label>Issue to
        <select id="issue-member" required></select>
      </label>
      <div class="dialog-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Issue book</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
